<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>播放器机制测试夹具 · 非个人AI动画项目</title>
<style>body{margin:24px;background:#20382f;color:#edf4e6;font:18px/1.65 sans-serif}button{min-width:44px;min-height:44px;margin:8px;padding:10px;font:inherit}h1{font-size:24px}#fixture-space{height:1200px}</style>
<body><main id="fixture-controls"><h1>播放器机制测试夹具</h1><p>以下庭院片段仅测试播放器，不是个人AI动画作品。</p><button id="fixture-open">打开测试片段</button><button id="fixture-error">打开失效片段</button><button id="fixture-rapid">快速关闭并重开</button><button id="fixture-image">切换测试图片</button><div id="fixture-space"></div></main><div id="fixture-viewer"></div>
<script type="module">
import '/src/tour/film.css';
import { createMediaViewer } from '/src/tour/createMediaViewer.ts';
const root=document.querySelector('#fixture-viewer'),controls=document.querySelector('#fixture-controls');
const counts={open:0,close:0};
const viewer=createMediaViewer(root,{open(){counts.open++;controls.inert=true;document.documentElement.style.overflow='hidden';},close(){counts.close++;controls.inert=false;document.documentElement.style.overflow='';}});
const clip={kind:'video',src:'/src/assets/courtyard-motion.mp4',title:'庭院片段：播放器机制测试',description:'12秒无声庭院演示，仅用于测试媒体行为。',statusLabel:'测试夹具 / 非个人AI动画作品'};
const bad={...clip,src:'/tests/scroll-garden/missing-fixture.mp4'};
const picture={kind:'image',src:'/src/assets/courtyard.png',title:'测试图片',description:'庭院截图，仅用于测试切换。',statusLabel:'测试夹具 / 非AI影像项目',alt:'庭院截图测试夹具'};
const open=document.querySelector('#fixture-open');open.addEventListener('click',()=>viewer.open(clip,open));
document.querySelector('#fixture-error').addEventListener('click',event=>viewer.open(bad,event.currentTarget));
document.querySelector('#fixture-rapid').addEventListener('click',event=>{viewer.open(clip,event.currentTarget);viewer.close();viewer.open(clip,event.currentTarget);});
document.querySelector('#fixture-image').addEventListener('click',event=>viewer.open(picture,event.currentTarget));
window.mediaFixture={viewer,clip,bad,picture,counts};document.body.dataset.fixtureReady='true';
</script></body></html>
