<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1180" viewBox="0 0 1240 1180" role="img" aria-labelledby="title desc">
<title id="title">sakan 三柱滚动庭院：第一步路线与阅读站点设计</title>
<desc id="desc">上方左侧为水潭和三柱的俯视阅读顺序，右侧为总计12.3个视口高度的滚动预算；下方为三根柱子3、4、3个阅读高度。所有位置仅为设计分镜，并非已实现镜头。</desc>
