const q=new URLSearchParams(location.search);if(['A1','A2','A3'].includes(q.get('screen')))state.screen=q.get('screen');if(['normal','detail','long','edge','all'].includes(q.get('state')))state.review=q.get('state');if(q.get('large')==='1'){state.large=true;document.documentElement.style.fontSize='200%'}
function identity(){const c=content.identity,title=c['主标题'].split(' / ');$('#identity-panel').innerHTML=`<p class="eyebrow">${escapeHTML(c['章节提示'])}</p><h1 class="identity-title">${escapeHTML(title[0])} <span>/ ${escapeHTML(title.slice(1).join(' / '))}</span></h1><p class="role">${escapeHTML(c['职业定位'])}</p><div class="intro"><p>${escapeHTML(c['介绍第一句'])}</p><p>${escapeHTML(c['介绍第二句'])}</p></div><div class="keywords">${c['关键词'].split(' · ').map(t=>`<span>${escapeHTML(t)}</span>`).join('')}</div><details class="reading-details"><summary>关于这个名字</summary><div class="detail-body">${escapeHTML(content.alias)}</div></details>`}
function experience(){const rows=content.experiences.map(c=>{let [company,...rest]=c.text.split(' · ');return `<div class="experience-line"><p class="experience-label">${escapeHTML(c.label)}</p><p class="experience-text"><strong>${escapeHTML(company)}</strong>${rest.length?`<span>${escapeHTML(rest.join(' · '))}</span>`:''}</p></div>`}).join('');$('#experience-panel').innerHTML=`<p class="eyebrow">经历与制作</p><h2 class="prose-title">${escapeHTML(content.experienceTitle)}</h2><div class="experience-list">${rows}</div><div class="process-strip">${content.process.map(p=>`<span>${escapeHTML(p.name)}</span>`).join('')}</div><details class="reading-details"><summary>制作环节与教育背景</summary><div class="detail-body"><div class="process-detail">${content.process.map(p=>`<div><strong>${escapeHTML(p.name)}</strong><p>${escapeHTML(p.text)}</p></div>`).join('')}</div><p class="education"><strong>教育背景</strong>${escapeHTML(content.education)}</p></div></details>`}
function card(c,detail=false){const initials=({'midjourney':'MJ','comfyui':'CF','kling':'可','blender':'BL','substance-painter':'SP','marvelous-designer':'MD','illustrator':'AI','unreal-engine':'UE'})[c.id]||c.shortName.slice(0,2).toUpperCase();return `<article class="tool-card${detail?' is-detail':''}" data-tool-id="${c.id}" aria-label="${escapeHTML(c.name)}"><header class="card-head"><span class="badge" aria-label="软件标识尺寸占位">${escapeHTML(initials)}</span><h3>${escapeHTML(c.name)}</h3></header><p class="card-use">${escapeHTML(c.use)}</p><p class="card-detail">${escapeHTML(c.detail)}</p><div class="card-tags">${c.tags.map(t=>`<span>${escapeHTML(t)}</span>`).join('')}</div></article>`}
function list(){let cards=content.cards.filter(c=>state.category==='all'||c.group===state.category);if(state.review==='long'){const ids=['substance-painter','marvelous-designer','illustrator','unreal-engine'];cards=ids.map(id=>content.cards.find(c=>c.id===id))}return cards}
function renderCards(){const cards=list(),all=state.review==='all';$('#catalog').hidden=!all;$('#rail').hidden=all;$('#catalog').innerHTML=all?cards.map(c=>card(c)).join(''):'';$('#rail-track').innerHTML=all?'':cards.map((c,i)=>`<div class="card-slot">${card(c,(state.review==='detail'&&i===1)||(state.review==='long'&&i===0)||(state.review==='edge'&&i===3))}</div>`).join('');$('#show-all').textContent=all?'返回卡片浏览':'查看全部工具';$('#filter-buttons').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category===state.category)));$('#category-select').value=state.category;$('#review-state').value=state.review;requestAnimationFrame(()=>{if(!all){$('#rail').scrollLeft=state.review==='normal'?savedRail:0;const focus=$('.tool-card.is-detail');if(focus){const slot=focus.closest('.card-slot');const rail=$('#rail');rail.scrollLeft=slot.offsetLeft-(rail.clientWidth-slot.clientWidth)/2}}scheduleLayout()})}
function setScreen(id){state.screen=id;document.body.dataset.page=id;document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===id)));document.querySelectorAll('.screen').forEach(p=>p.hidden=p.id!=='screen-'+id);$('#review-state').disabled=id!=='A3';if(id==='A3')renderCards();scheduleLayout();window.scrollTo(0,0)}
function layout(){layoutFrame=0;const review=$('.review-bar').getBoundingClientRect().height;document.documentElement.style.setProperty('--review-height',review+'px');const font=parseFloat(getComputedStyle(document.documentElement).fontSize),reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;let reason='空间适合沉浸排版',flow=innerWidth<1180||innerHeight<760||font>20||reduced||(state.screen==='A3'&&state.review==='all');if(innerWidth<1180||innerHeight<760)reason='当前空间采用稳定阅读';if(font>20)reason='大字采用稳定阅读';if(reduced)reason='减少动态采用稳定阅读';if(state.screen==='A3'&&state.review==='all')reason='全部工具 · 静态阅读';document.body.dataset.layout=flow?'flow':'immersive';if(!flow){const stage=$('#stage').getBoundingClientRect();let fits=true;if(state.screen==='A3'){const rail=$('#rail').getBoundingClientRect();const h=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-h'));fits=rail.height>=h*1.15+34&&$('#screen-A3').scrollHeight<=$('#screen-A3').clientHeight+2}else{const panel=$('#screen-'+state.screen+' .prose-panel').getBoundingClientRect();fits=panel.height<=stage.height-32}if(!fits){flow=true;reason='完整内容需要稳定阅读';document.body.dataset.layout='flow'}}$('#layout-status').textContent=reason;document.body.dataset.layoutReady='true';document.body.dataset.reviewState=state.review;document.body.dataset.rootFont=font;scheduleVisibleDetail()}
function scheduleVisibleDetail(){if(state.screen!=='A3'||state.review==='all')return;requestAnimationFrame(()=>{const focus=$('.tool-card.is-detail');if(focus){const rail=$('#rail'),slot=focus.closest('.card-slot');rail.scrollLeft=Math.max(0,slot.offsetLeft-(rail.clientWidth-slot.clientWidth)/2)}})}
function scheduleLayout(){if(!layoutFrame)layoutFrame=requestAnimationFrame(layout)}
identity();experience();$('#tools-title').textContent=content.tools['主标题'];$('#tools-intro').textContent=content.tools['介绍'];const groups=[{id:'all',name:'全部'},...content.groups];$('#filter-buttons').innerHTML=groups.map(g=>`<button data-category="${g.id}" aria-pressed="${g.id===state.category}">${escapeHTML(g.name)}</button>`).join('');$('#category-select').innerHTML=groups.map(g=>`<option value="${g.id}">${escapeHTML(g.name)}</option>`).join('');
document.querySelectorAll('[data-screen]').forEach(b=>b.addEventListener('click',()=>setScreen(b.dataset.screen)));
function changeReview(next){if(state.review!=='all'&&next==='all'){beforeAll={category:state.category,rail:$('#rail').scrollLeft,review:state.review};state.category='all'}else if(state.review==='all'&&next!=='all'&&beforeAll){state.category=beforeAll.category;savedRail=beforeAll.rail;beforeAll=null}else if(state.review==='normal')savedRail=$('#rail').scrollLeft;state.review=next;renderCards();window.scrollTo(0,0)}
$('#review-state').addEventListener('change',e=>changeReview(e.target.value));
$('#large-font').setAttribute('aria-pressed',String(state.large));$('#large-font').addEventListener('click',()=>{state.large=!state.large;document.documentElement.style.fontSize=state.large?'200%':'';$('#large-font').setAttribute('aria-pressed',String(state.large));scheduleLayout()});
function filter(id){state.category=id;savedRail=0;if(state.review!=='all')state.review='normal';renderCards()};$('#filter-buttons').addEventListener('click',e=>{const b=e.target.closest('button');if(b)filter(b.dataset.category)});$('#category-select').addEventListener('change',e=>filter(e.target.value));
$('#show-all').addEventListener('click',()=>changeReview(state.review==='all'?(beforeAll?.review||'normal'):'all'));
$('#previous-card').addEventListener('click',()=>{$('#rail').scrollLeft-=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-w'))+24;savedRail=$('#rail').scrollLeft});$('#next-card').addEventListener('click',()=>{$('#rail').scrollLeft+=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-w'))+24;savedRail=$('#rail').scrollLeft});
$('#pause-auto').addEventListener('click',()=>{state.paused=!state.paused;$('#pause-auto').textContent=state.paused?'继续自动展示':'暂停自动展示';$('#pause-auto').setAttribute('aria-pressed',String(state.paused));$('#layout-status').textContent='自动展示控件状态示意；本稿没有自动移动'});
$('#continue-reading').addEventListener('click',()=>{$('#layout-status').textContent='继续入口位置示意；章节衔接留给第 4、13 步'});
document.querySelectorAll('.reading-details').forEach(d=>d.addEventListener('toggle',scheduleLayout));addEventListener('resize',scheduleLayout);matchMedia('(prefers-reduced-motion:reduce)').addEventListener('change',scheduleLayout);document.fonts.ready.then(scheduleLayout);setScreen(state.screen);
</script>
</body>
</html>
